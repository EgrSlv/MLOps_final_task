name: Deploy to Cloud.ru

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile.api"
      - "requirements-api.txt"
  workflow_dispatch:

env:
  REGISTRY_URI: ${{ secrets.CLOUD_REGISTRY_URI }}
  IMAGE_NAME: titanic-survival-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Cloud.ru Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CLOUD_REGISTRY_URI }}
          username: ${{ secrets.EVO_CR_LOGIN }}
          password: ${{ secrets.EVO_CR_PWD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY_URI }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY_URI }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
